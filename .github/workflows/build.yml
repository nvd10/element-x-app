```
permissions:
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

steps:
  - name: Free Disk Space (Ubuntu)
    uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
    with:
      tool-cache: true
      android: false
      dotnet: true
      haskell: true
      large-packages: false
      docker-images: true
      swap-storage: false

  - name: Checkout
    uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      persist-credentials: false

  - name: Use JDK 21
    uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
    with:
      distribution: temurin
      java-version: 21

  - name: Configure Gradle
    uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
    with:
      cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

  - name: Build Release APK
    env:
      ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
      ELEMENT_ANDROID_MAPTILER_LIGHT_MAP_ID: ${{ secrets.MAPTILER_LIGHT_MAP_ID }}
      ELEMENT_ANDROID_MAPTILER_DARK_MAP_ID: ${{ secrets.MAPTILER_DARK_MAP_ID }}
      ELEMENT_ANDROID_SENTRY_DSN: ${{ secrets.ELEMENT_ANDROID_SENTRY_DSN }}
      ELEMENT_SDK_SENTRY_DSN: ${{ secrets.ELEMENT_SDK_SENTRY_DSN }}
      ELEMENT_CALL_SENTRY_DSN: ${{ secrets.ELEMENT_CALL_SENTRY_DSN }}
      ELEMENT_CALL_POSTHOG_API_HOST: ${{ secrets.ELEMENT_CALL_POSTHOG_API_HOST }}
      ELEMENT_CALL_POSTHOG_API_KEY: ${{ secrets.ELEMENT_CALL_POSTHOG_API_KEY }}
      ELEMENT_CALL_RAGESHAKE_URL: ${{ secrets.ELEMENT_CALL_RAGESHAKE_URL }}
    run: |
      ./gradlew \
        :app:assembleGplayRelease \
        -PallWarningsAsErrors=true \
        $CI_GRADLE_ARG_PROPERTIES

  - name: Upload ARM64 Release APK
    uses: actions/upload-artifact@v4
    with:
      name: elementx-release-arm64
      path: |
        app/build/outputs/apk/gplay/release/*arm64-v8a-release.apk
      if-no-files-found: error

  - name: Upload Universal Release APK (fallback)
    uses: actions/upload-artifact@v4
    continue-on-error: true
    with:
      name: elementx-release-universal
      path: |
        app/build/outputs/apk/gplay/release/*universal-release.apk
