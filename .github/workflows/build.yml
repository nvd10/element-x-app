name: Signed Release APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
  CI_ARGS: --stacktrace --no-configuration-cache

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # Checkout
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # Setup JDK
      # ---------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ---------------------------
      # Gradle cache (FAST BUILD)
      # ---------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ---------------------------
      # Decode keystore (FIXED PATH - NO app/app BUG)
      # ---------------------------
      - name: Decode Keystore
        run: |
          mkdir -p $GITHUB_WORKSPACE/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/app/keystore.jks

      # ---------------------------
      # Build SIGNED RELEASE APK (arm64 only)
      # ---------------------------
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/app/keystore.jks
        run: |
          ./gradlew :app:assembleGplayRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            -PallWarningsAsErrors=true \
            $CI_ARGS

      # ---------------------------
      # Upload APK artifact
      # ---------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64-v8a
          path: |
            app/build/outputs/apk/gplay/release/*arm64-v8a*.apk
