name: APK Build (Release Only)

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  build:
    name: Build Signed Release APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ---------------------------
      # Decode keystore
      # ---------------------------
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # ---------------------------
      # Build signed release APK
      # ---------------------------
      - name: Build Release APK (arm64-v8a only)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleGplayRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES

      # ---------------------------
      # Upload APK
      # ---------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64-v8a
          path: |
            app/build/outputs/apk/gplay/release/*arm64-v8a*.apk
